<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Your Password | Hairshalo</title>
<meta name="description" content="Request a password reset link for your Hairshalo account.">
<meta name="theme-color" content="#1A2338">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://hairshalo.com/forgot-password">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body>
<div class="auth-shell">
  <header class="auth-top">
    <a href="/" class="logo" aria-label="Hairshalo — home">
      <img class="logo-mark" src="assets/hairshalo-mark.png" alt="" width="23" height="28">HAIRSHALO
    </a>
    <a class="back" href="/signin">&larr; Back to sign in</a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-head">
        <span class="eyebrow">Your Account</span>
        <h1 id="heading">Reset your password</h1>
        <p id="lede">Enter the email address on your account and we will send you a link to set a new password.</p>
      </div>

      <div class="notice" id="notice"></div>

      <form id="form" novalidate>
        <div class="field">
          <label for="email">Email address <span class="req" aria-hidden="true">*</span></label>
          <div class="control">
            <input type="email" id="email" name="email" autocomplete="email"
                   inputmode="email" required aria-describedby="emailErr">
          </div>
          <p class="err" id="emailErr"></p>
        </div>

        <button class="btn btn-primary" type="submit" id="submit">
          <span class="spinner" aria-hidden="true"></span><span class="label">Send reset link</span>
        </button>
      </form>

      <p class="auth-alt">
        Remembered it? <a href="/signin">Sign in</a>
      </p>
    </div>
  </main>
</div>

<script src="assets/auth.js"></script>
<script>
(function () {
  var A = window.HairshaloAuth;
  var form = A.$('#form'), notice = A.$('#notice'), submit = A.$('#submit'), email = A.$('#email');

  email.addEventListener('input', function () { A.fieldError(email, ''); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    A.hideNotice(notice);
    if (!A.fieldError(email, A.emailLooksValid(email.value) ? '' : 'Enter a valid email address.')) {
      email.focus();
      return;
    }

    A.setBusy(submit, true, 'Sending…');
    A.api('/account/password-reset/request', {
      method: 'POST',
      body: { email: email.value.trim() }
    }).then(function (data) {
      /* The server answers the same way for a known and an unknown address, so
         this page cannot be used to test whether someone has an account. The
         wording keeps that promise: "if that address has an account". */
      form.style.display = 'none';
      A.$('#heading').textContent = 'Check your inbox';
      A.$('#lede').textContent =
        'The link is valid for one hour. If it does not arrive, check your spam folder.';
      A.showNotice(notice, 'ok', data.message ||
        'If that address has an account, we have sent a password reset link.');
    }).catch(function (err) {
      A.setBusy(submit, false);
      A.showNotice(notice, 'error', err.message);
    });
  });
})();
</script>
</body>
</html>
