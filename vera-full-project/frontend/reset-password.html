<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set a New Password | Hairshalo</title>
<meta name="description" content="Choose a new password for your Hairshalo account.">
<meta name="theme-color" content="#1A2338">
<meta name="robots" content="noindex, nofollow">
<!-- The reset token arrives in the query string. Referrer is suppressed so it
     is never handed to a third party by an outbound request. -->
<meta name="referrer" content="no-referrer">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/auth.css">
</head>
<body>
<div class="auth-shell">
  <header class="auth-top">
    <a href="/" class="logo" aria-label="Hairshalo — home">
      <img class="logo-mark" src="assets/hairshalo-mark.png" alt="" width="23" height="28">HAIRSHALO
    </a>
    <a class="back" href="/signin">&larr; Back to sign in</a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-head">
        <span class="eyebrow">Your Account</span>
        <h1 id="heading">Choose a new password</h1>
        <p id="lede">Pick something you have not used on another site.</p>
      </div>

      <div class="notice" id="notice"></div>

      <form id="form" novalidate>
        <div class="field">
          <label for="password">New password <span class="req" aria-hidden="true">*</span></label>
          <div class="control">
            <input type="password" id="password" name="password"
                   autocomplete="new-password" required aria-describedby="pwRules passwordErr">
          </div>
          <ul class="pw-rules" id="pwRules" aria-live="polite"></ul>
          <p class="err" id="passwordErr"></p>
        </div>

        <div class="field">
          <label for="confirm">Confirm new password <span class="req" aria-hidden="true">*</span></label>
          <div class="control">
            <input type="password" id="confirm" name="confirm"
                   autocomplete="new-password" required aria-describedby="confirmErr">
          </div>
          <p class="err" id="confirmErr"></p>
        </div>

        <button class="btn btn-primary" type="submit" id="submit">
          <span class="spinner" aria-hidden="true"></span><span class="label">Save new password</span>
        </button>
      </form>

      <p class="auth-alt" id="altLine">
        <a href="/forgot-password">Request a new link</a>
      </p>
    </div>
  </main>
</div>

<script src="assets/auth.js"></script>
<script>
(function () {
  var A = window.HairshaloAuth;
  var form = A.$('#form'), notice = A.$('#notice'), submit = A.$('#submit');
  var password = A.$('#password'), confirm = A.$('#confirm'), rules = A.$('#pwRules');
  var token = A.queryParam('token');

  A.attachPasswordToggle(password);
  A.attachPasswordToggle(confirm);
  A.renderPasswordRules(rules, '', '');

  // No token, no form. Saying so here beats a confusing failure on submit.
  if (!token) {
    form.style.display = 'none';
    A.$('#heading').textContent = 'That link is incomplete';
    A.$('#lede').textContent =
      'Open the link exactly as it appears in the email, or request a new one.';
    A.showNotice(notice, 'error', 'This page needs the reset link from your email.');
  }

  password.addEventListener('input', function () {
    A.renderPasswordRules(rules, password.value, '');
    A.fieldError(password, '');
  });
  confirm.addEventListener('input', function () { A.fieldError(confirm, ''); });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    A.hideNotice(notice);

    var ok = true;
    ok = A.fieldError(password, A.passwordOk(password.value, '')
          ? '' : 'Your password does not meet the requirements above.') && ok;
    ok = A.fieldError(confirm, confirm.value === password.value
          ? '' : 'The two passwords do not match.') && ok;
    if (!ok) { form.querySelector('[aria-invalid="true"]').focus(); return; }

    A.setBusy(submit, true, 'Saving…');
    A.api('/account/password-reset/confirm', {
      method: 'POST',
      body: { token: token, new_password: password.value }
    }).then(function (data) {
      /* Changing the password invalidates existing sessions server-side, so
         any token cached in this browser is already dead — drop it rather than
         leave a stale one behind. */
      A.setToken(null);
      form.style.display = 'none';
      A.$('#heading').textContent = 'Password updated';
      A.$('#lede').textContent =
        'You have been signed out everywhere else. Sign in with your new password.';
      A.$('#altLine').innerHTML = '<a class="btn btn-outline" href="/signin">Go to sign in</a>';
      A.showNotice(notice, 'ok', data.message || 'Your password has been changed.');
    }).catch(function (err) {
      A.setBusy(submit, false);
      // An expired or already-used token is the common case; the server's
      // wording explains it, and the recovery path is one link away.
      A.showNotice(notice, 'error', err.message);
    });
  });
})();
</script>
</body>
</html>
