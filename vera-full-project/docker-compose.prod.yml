# Production stack: Postgres, the API, the notification worker, and Caddy for
# TLS. Run it with an env file that is NOT in git:
#
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from docker-compose.yml (which is for development):
#   * Postgres publishes no host port — only the app network reaches it.
#   * Every secret comes from the env file; nothing is hard-coded here.
#   * APP_ENV=production, so the startup preflight refuses unsafe settings.
#   * Mail delivery is a separate process, so retries have one owner.
#   * Containers restart on failure and are capped so one cannot starve the host.
#
# The four memory caps come from the env file, because the right numbers depend
# on the box. The fallbacks below are deliberately the smallest set (1 GB), so
# a missing variable under-uses the host rather than over-committing it;
# .env.prod.example carries the real sets for 1, 2 and 4 GB. A cap larger than
# the host is not a cap at all -- the OOM killer picks the victim instead, and
# it will not pick the container you would have.

name: vera-prod

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default_logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-vera_hair_co}
    volumes:
      - vera_pgdata:/var/lib/postgresql/data
      # Backups land on the host, not inside the data volume: a volume that is
      # lost or corrupted must not take its own backups with it.
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-384m}

  api:
    build: ./backend
    restart: unless-stopped
    logging: *default_logging
    depends_on:
      db:
        condition: service_healthy
    environment: &app_env
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vera_hair_co}
      SECRET_KEY: ${SECRET_KEY:?generate one with python -c "import secrets; print(secrets.token_urlsafe(48))"}
      CORS_ORIGINS: ${CORS_ORIGINS:?set your storefront origin(s)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set your API hostname(s)}
      TRUST_PROXY: "true"          # Caddy terminates TLS in front of this
      # Read by the gunicorn command in backend/Dockerfile. It has to be listed
      # here to reach the container at all: --env-file only substitutes into
      # this file, it does not put variables inside the containers.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      LOG_FORMAT: json
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GIT_SHA: ${GIT_SHA:-}
      # Payments
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Notifications — the API queues, the notifier delivers.
      NOTIFY_DISPATCH: worker
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-orders@hairshalo.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Hairshalo}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      ADMIN_ALERT_EMAILS: ${ADMIN_ALERT_EMAILS:-}
      STOREFRONT_URL: ${STOREFRONT_URL:-}
      # Mail cannot load a relative path, so the logo needs an absolute URL.
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      LOW_STOCK_ALERT_THRESHOLD: ${LOW_STOCK_ALERT_THRESHOLD:-5}
      # Storefront economics. These belong in the env file rather than the
      # code: the shop owner changes a shipping fee far more often than anyone
      # rebuilds an image, and a rebuild to change a number invites editing
      # the default in git instead.
      SHIPPING_FLAT_FEE: ${SHIPPING_FLAT_FEE:-499}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-8000}
      LOYALTY_EARN_PER: ${LOYALTY_EARN_PER:-100}
      LOYALTY_POINT_VALUE: ${LOYALTY_POINT_VALUE:-1}
      LOYALTY_MAX_REDEEM_PCT: ${LOYALTY_MAX_REDEEM_PCT:-20}
      # Tunable without a rebuild when a real traffic pattern shows up.
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-60/60}
      RATE_LIMIT_WRITE: ${RATE_LIMIT_WRITE:-12/60}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-8/300}
    volumes:
      - vera_media:/app/media
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-320m}

  notifier:
    build: ./backend
    restart: unless-stopped
    logging: *default_logging
    depends_on:
      db:
        condition: service_healthy
      # The API owns migrations, so wait for it to report healthy. Starting
      # alongside it means polling a schema that does not exist yet, which on a
      # fresh database logs an UndefinedTable traceback until the next retry.
      api:
        condition: service_healthy
    environment:
      <<: *app_env
      # The API applies migrations; a second process racing on the same DDL is
      # how a deploy deadlocks.
      RUN_MIGRATIONS: "false"
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["python", "-m", "app.notify_worker", "--loop", "--interval", "15"]
    # This container runs the mail worker, not the web server, so the HTTP probe
    # it inherits from the image can never pass and would report unhealthy
    # forever. restart: unless-stopped already replaces the process if it exits.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: ${NOTIFIER_MEM_LIMIT:-128m}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default_logging
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?set the public hostname, e.g. hairshalo.com}
      # Caddy needs this to obtain a certificate for www and redirect it to the
      # apex. Listing www in ALLOWED_HOSTS alone does nothing: without a cert
      # the browser never gets far enough to send a Host header.
      WWW_DOMAIN: ${WWW_DOMAIN:-www.hairshalo.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # certificates — losing this re-issues them
      - caddy_config:/config
      - ./frontend:/srv/frontend:ro
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEM_LIMIT:-96m}

volumes:
  vera_pgdata:
  vera_media:
  caddy_data:
  caddy_config:
