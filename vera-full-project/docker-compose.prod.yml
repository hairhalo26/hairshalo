# Production stack: Postgres, the API, the notification worker, and Caddy for
# TLS. Run it with an env file that is NOT in git:
#
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Differences from docker-compose.yml (which is for development):
#   * Postgres publishes no host port — only the app network reaches it.
#   * Every secret comes from the env file; nothing is hard-coded here.
#   * APP_ENV=production, so the startup preflight refuses unsafe settings.
#   * Mail delivery is a separate process, so retries have one owner.
#   * Containers restart on failure and are capped so one cannot starve the host.

name: vera-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in the env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-vera_hair_co}
    volumes:
      - vera_pgdata:/var/lib/postgresql/data
      # Backups land on the host, not inside the data volume: a volume that is
      # lost or corrupted must not take its own backups with it.
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &app_env
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vera_hair_co}
      SECRET_KEY: ${SECRET_KEY:?generate one with python -c "import secrets; print(secrets.token_urlsafe(48))"}
      CORS_ORIGINS: ${CORS_ORIGINS:?set your storefront origin(s)}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set your API hostname(s)}
      TRUST_PROXY: "true"          # Caddy terminates TLS in front of this
      LOG_FORMAT: json
      APP_VERSION: ${APP_VERSION:-1.0.0}
      GIT_SHA: ${GIT_SHA:-}
      # Payments
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      # Notifications — the API queues, the notifier delivers.
      NOTIFY_DISPATCH: worker
      NOTIFY_CHANNEL: ${NOTIFY_CHANNEL:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-orders@verahair.co}
      ADMIN_ALERT_EMAILS: ${ADMIN_ALERT_EMAILS:-}
      STOREFRONT_URL: ${STOREFRONT_URL:-}
    volumes:
      - vera_media:/app/media
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512m

  notifier:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # The API owns migrations, so wait for it to report healthy. Starting
      # alongside it means polling a schema that does not exist yet, which on a
      # fresh database logs an UndefinedTable traceback until the next retry.
      api:
        condition: service_healthy
    environment:
      <<: *app_env
      # The API applies migrations; a second process racing on the same DDL is
      # how a deploy deadlocks.
      RUN_MIGRATIONS: "false"
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["python", "-m", "app.notify_worker", "--loop", "--interval", "15"]
    # This container runs the mail worker, not the web server, so the HTTP probe
    # it inherits from the image can never pass and would report unhealthy
    # forever. restart: unless-stopped already replaces the process if it exits.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 256m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?set the public hostname, e.g. api.verahair.co}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # certificates — losing this re-issues them
      - caddy_config:/config
      - ./frontend:/srv/frontend:ro

volumes:
  vera_pgdata:
  vera_media:
  caddy_data:
  caddy_config:
